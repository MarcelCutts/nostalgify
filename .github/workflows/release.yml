# Builds only the desktop package and opens a draft release. iPad distribution
# uses Xcode signing; this workflow does not archive or upload an iOS application.
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build Apple Silicon and Intel apps
        run: npm run package:release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/Nostalgify-*.zip \
            --draft \
            --title "Nostalgify $GITHUB_REF_NAME" \
            --generate-notes
